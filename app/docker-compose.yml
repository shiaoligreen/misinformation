version: '3.8'

services:
  backend:
    build: .
    # Overrides the Streamlit entrypoint in your Dockerfile to run FastAPI instead
    entrypoint: ["uvicorn", "be_fast:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      # This points Streamlit to the 'backend' service container we created above
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend